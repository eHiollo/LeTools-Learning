# RL-100 real deployment.  This file is deliberately shadow-only until the
# field-approved joint limits and startup pose are filled in below.
contract: rl100_topic_native_v1
state_dim: 32
action_dim: 26
checkpoint:
  path: third_party/RL-100/data/epoch=2900-test_mean_score=-0.000.ckpt
  device: cuda:0
  model_source: auto

inference:
  deterministic: true
  distill2mean: false
  use_cm: auto
  # Keep the model's action horizon as a small refillable queue.  Actions are
  # still consumed at the 10 Hz dataset rate; inference may run slower.
  execute_steps: 4
  action_buffer_size: 8
  action_low_watermark: 2
  control_hz: 10
  # Startup/empty-buffer wait bound, not a per-tick synchronous inference
  # requirement.  Slow results are accepted while the queue has actions.
  # 3.0s tolerates the cold-start DDIM sampling + CUDA kernel JIT on the first
  # tick (warmup below primes the kernels, but cuDNN/curand may still lazy-init).
  timeout_s: 3.0
  warmup_runs: 3

observation:
  pointcloud_config: configs/rl/rl100_zarr_collect_upper_cams.yaml
  history_startup: repeat_first
  raw_joint_topic: /sensors_data_raw
  dexhand_state_topic: /dexhand/state
  joint_state_max_age_s: 0.15
  dexhand_state_max_age_s: 0.50
  state_max_skew_s: 0.10
  depth_max_age_s: 0.30
  # Keep deployment aligned with the collection contract; revisit after data QA.
  max_camera_skew_s: 0.20
  max_state_cloud_skew_s: 0.50
  camera_sync:
    mode: buffered_header
    reference_camera: head_cam_h
    buffer_size: 32
    max_header_skew_s: 0.20
    warn_header_skew_s: 0.05
    max_received_age_s: 0.30
    max_receive_skew_s: 0.10
    require_monotonic_header: true
    require_same_time_epoch: true
    tf_at_image_stamp: true
    tf_timeout_s: 0.20
    max_consecutive_sync_failures: 10

publish:
  arm_topic: /kuavo_arm_traj
  hand_topic: /control_robot_hand_position
  arm_unit: degree
  hand_range: [0, 100]
  hand_rounding: nearest
  require_subscribers: false
  arm_joint_names: [arm_joint_0, arm_joint_1, arm_joint_2, arm_joint_3,
                    arm_joint_4, arm_joint_5, arm_joint_6, arm_joint_7,
                    arm_joint_8, arm_joint_9, arm_joint_10, arm_joint_11,
                    arm_joint_12, arm_joint_13]

safety:
  # Empirical envelope from the 30-episode topic-native dataset:
  # state raw joint_q[4:18] (rad) union action arm14_deg (deg -> rad).
  # This is a conservative demo envelope, not the robot's mechanical limit.
  arm_joint_low_rad: [-1.140217, -0.203979, -0.780370, -2.235270,
                      -0.215930, -0.434978, -0.593412, -1.191048,
                      -0.835366, -0.459989, -2.150153, -0.919109,
                      -0.593412, -0.543650]
  arm_joint_high_rad: [0.600001, 0.707139, 0.236752, 0.000000,
                       0.832523, 0.593412, 0.593412, 0.413360,
                       0.247863, 0.950259, 0.000000, 0.863529,
                       0.810977, 0.593412]
  max_arm_step_rad: 0.02
  max_hand_step: 5.0
  max_arm_state_jump_rad: 0.05
  max_hand_state_jump: 5.0
  max_consecutive_clips: 0
  max_consecutive_source_failures: 3
  max_episode_steps: 200
  max_episode_duration_s: 120.0
  fault_hold_once_if_state_fresh: true

startup:
  hand_default: [60, 0, 0, 0, 0, 0, 59, 0, 0, 0, 0, 0]
  hand_default_tolerance: 2.0
  require_physical_estop_ready: true
  require_operator_start: true

mode:
  shadow: true
  # Keep empty in git. The live CLI requires a non-empty one-time token.
  live_confirmation_token: ""

logging:
  output_dir: logs/rl100_real
  jsonl: true
  save_predicted_chunks: true
  save_pointcloud: false
