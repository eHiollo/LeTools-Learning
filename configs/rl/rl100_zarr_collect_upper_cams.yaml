# RL-100 zarr — upper-machine cameras (hil_upper_cams.launch).
#
# Topics from Orbbec head (/camera) + RealSense wrists (/left|right_wrist_camera).
# Use with: roslaunch configs/launch/hil_upper_cams.launch

task: grasp_8_4_v2
contract: rl100_topic_native_v1
output_root: data/rl100
zarr_name: grasp_8_4_v2.zarr
overwrite: false
# Diffusion BC should not imitate failed demonstrations.
only_success: true

fps: 10
num_points: 1024
state_dim: 32
action_dim: 26
arm_command_dim: 14
hand_command_dim: 12
raw_joint_dim: 20
dexhand_state_dim: 12

lambda_penalty: 0.05
smooth_penalty: 0.0
max_episode_len: 2000

base_frame: base_link
workspace:
  x_range: [0.0, 1.2]
  y_range: [-0.6, 0.6]
  z_range: [0.0, 1.4]

cameras:
  - name: head_cam_h
    depth_topic: /camera/depth/image_raw/compressedDepth
    camera_info_topic: /camera/depth/camera_info
    frame_id: camera_color_optical_frame
    depth_msg_type: compressed_depth
    enabled: true
  - name: wrist_cam_l
    depth_topic: /left_wrist_camera/depth/image_rect_raw/compressedDepth
    camera_info_topic: /left_wrist_camera/depth/camera_info
    frame_id: left_wrist_camera_depth_optical_frame
    depth_msg_type: compressed_depth
    enabled: true
  - name: wrist_cam_r
    depth_topic: /right_wrist_camera/depth/image_rect_raw/compressedDepth
    camera_info_topic: /right_wrist_camera/depth/camera_info
    frame_id: right_wrist_camera_depth_optical_frame
    depth_msg_type: compressed_depth
    enabled: true

require_all_cameras: true
fail_on_empty_pointcloud: true
min_workspace_points: 32

joystick_topic: /quest_joystick_data
arm_traj_topic: /kuavo_arm_traj
sensors_topic: /sensors_data_raw
dexhand_state_topic: /dexhand/state
hand_command_topic: /control_robot_hand_position
hand_default: [0, 99, 0, 0, 0, 0, 0, 99, 0, 0, 0, 0]
hand_default_tolerance: 2.0
start_on_any_command: true
command_hold_last: true
command_timeout_s: null
joint_state_max_age_s: 0.15
dexhand_state_max_age_s: 0.15
state_max_skew_s: 0.10
depth_max_age_s: 0.15
camera_max_skew_s: 0.10
max_consecutive_source_failures: 3

# Never write hold-state fallbacks as BC labels. For this grasp task at least
# one hand must move by 5% or the episode is discarded before staging.
require_hand_motion: true
min_hand_action_range: 5.0

confirm_live: true
shadow_mode: true
# State-only gym obs (joint+claw). Point clouds come from DepthPointCloudHub below.
# Do NOT use deploy_total.yaml here — that waits on Brain /cam_h|l|r H.265.
deploy_config: configs/deploy/total/deploy_real_rl100_upper.yaml
env_config: configs/rl/kuavo_hilserl_real_mvp.yaml
live_max_steps: 100000
live_max_duration_s: 86400
# Align with main HIL collect (quest_y_button + B short/long).
episode_control: quest_y_button
chord_long_press_s: 0.8
# 右摇杆上下打标签（下=success，上=failure）。改回 B 键则设为 button。
reward_gesture: right_stick_ud
reward_stick_threshold: 0.80
reward_stick_rearm_threshold: 0.20
reward_stick_debounce_s: 0.25
