# Parallel RL-100 zarr collection — aligned with real-robot HIL collect.
#
# Same deploy/env/teleop wiring as configs/rl/hil_collection_real_v001.yaml.
# Depth topics match the raw image path used by kuavo_deploy obs_buffer.
#
# Output layout:
#   data/rl100/<task>/episodes/*.npz   # per-episode staging
#   data/rl100/<task>/demo.zarr          # merged RL-100 dataset

task: box_to_chest_v1
contract: rl100_topic_native_v1
output_root: data/rl100
zarr_name: demo.zarr
overwrite: false

# Keep failures by default (HIL B long press). Use CLI --only-success to drop them.
only_success: false

fps: 10
num_points: 1024
state_dim: 32
action_dim: 26
arm_command_dim: 14
hand_command_dim: 12
raw_joint_dim: 20
dexhand_state_dim: 12

# RL-100-style sparse terminal reward shaping
lambda_penalty: 0.05
smooth_penalty: 0.0001
max_episode_len: 2000

base_frame: base_link
workspace:
  x_range: [0.0, 1.2]
  y_range: [-0.6, 0.6]
  z_range: [0.0, 1.4]

# Three cameras fused into one (1024, 3) point cloud — RL-100 schema.
# Use raw depth so synchronization is based on the camera sampling header,
# without an extra compressedDepth transport/decode queue.
cameras:
  - name: head_cam_h
    depth_topic: /cam_h/depth/image_raw
    camera_info_topic: /cam_h/depth/camera_info
    frame_id: cam_h_depth_optical_frame
    depth_msg_type: image
    enabled: true
  - name: wrist_cam_l
    depth_topic: /cam_l/depth/image_rect_raw
    camera_info_topic: /cam_l/depth/camera_info
    frame_id: cam_l_depth_optical_frame
    depth_msg_type: image
    enabled: true
  - name: wrist_cam_r
    depth_topic: /cam_r/depth/image_rect_raw
    camera_info_topic: /cam_r/depth/camera_info
    frame_id: cam_r_depth_optical_frame
    depth_msg_type: image
    enabled: true

require_all_cameras: true
fail_on_empty_pointcloud: true
min_workspace_points: 32

joystick_topic: /quest_joystick_data
arm_traj_topic: /kuavo_arm_traj
sensors_topic: /sensors_data_raw
dexhand_state_topic: /dexhand/state
hand_command_topic: /control_robot_hand_position
hand_default: [0, 99, 0, 0, 0, 0, 0, 99, 0, 0, 0, 0]
hand_default_tolerance: 2.0
start_on_any_command: true
command_hold_last: true
command_timeout_s: null
joint_state_max_age_s: 0.15
dexhand_state_max_age_s: 0.15
state_max_skew_s: 0.10
depth_max_age_s: 0.15
camera_max_skew_s: 0.10
max_consecutive_source_failures: 3

camera_sync:
  mode: buffered_header
  reference_camera: head_cam_h
  buffer_size: 32
  max_header_skew_s: 0.10
  warn_header_skew_s: 0.05
  max_received_age_s: 0.20
  max_receive_skew_s: 0.20
  require_monotonic_header: true
  require_same_time_epoch: true
  tf_at_image_stamp: true
  tf_timeout_s: 0.05
  max_consecutive_sync_failures: 10
require_hand_motion: false
min_hand_action_range: 5.0

# Live collect — real robot (same as hil_collection_real_v001)
confirm_live: false
shadow_mode: true
deploy_config: configs/deploy/total/deploy_total.yaml
env_config: configs/rl/kuavo_hilserl_real_mvp.yaml
# Soft safety ceilings only; episode ends on B (HIL VR collect pattern)
live_max_steps: 100000
live_max_duration_s: 86400
